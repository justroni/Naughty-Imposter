<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Naughty Imposter</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="menu-container">
    
    <!-- Top Stats Bar -->
    <div class="stats-row">
      <div class="stat-box">
        <span class="stat-icon">👥</span>
        <span class="stat-label">Players</span>
        <span class="stat-value">3–15</span>
      </div>
      <div class="stat-box">
        <span class="stat-icon">🐷</span>
        <span class="stat-label">Roles</span>
        <span class="stat-value">1–5</span>
      </div>
      <div class="stat-box">
        <span class="stat-icon">🔄</span>
        <span class="stat-label">Rounds</span>
        <span class="stat-value">3</span>
      </div>
    </div>

    <!-- Full-Width Uniform Buttons -->
    <div class="button-list">
      <button class="btn btn-play">💀 PLAY NOW 💀</button>
      <button class="btn btn-host">HOST LOBBY</button>
      <button class="btn btn-join">JOIN ROOM</button>
      <button class="btn btn-help">HOW TO PLAY</button>
      <button class="btn btn-settings">SETTINGS</button>
    </div>

    <!-- Artwork Banner Below Settings -->
    <div class="banner-container">
      <img src="menu-bg.jpg" alt="The Naughty Imposter" class="banner-img" />
    </div>

  </div>
</body>
</html>
