        <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Naughty Imposter</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css?v=3" />
</head>
<body>
  <div class="menu-container">
    
    <!-- Top Header Banner -->
    <div class="title-banner">
      <span>LETS GET NAUGHTY</span>
    </div>

    <!-- Main Menu Buttons -->
    <div class="button-list">
      <button class="btn btn-play" id="playBtn">💀 PLAY NOW 💀</button>
      <button class="btn btn-host" id="hostBtn">HOST LOBBY</button>
      <button class="btn btn-join" id="joinBtn">JOIN ROOM</button>
      <button class="btn btn-help" id="helpBtn">HOW TO PLAY</button>
      <button class="btn btn-settings" id="settingsBtn">SETTINGS</button>
    </div>

    <!-- Artwork Banner -->
    <div class="banner-container">
      <img src="menu-bg.jpg" alt="The Naughty Imposter" class="banner-img" />
    </div>

  </div>

  <!-- Host Setup Modal Overlay -->
  <div class="modal-overlay hidden" id="hostModal">
    <div class="modal-card">
      <div class="modal-header">
        <h2>👑 HOST LOBBY</h2>
        <button class="close-btn" id="closeHostBtn">✖</button>
      </div>

      <div class="form-group">
        <label>Your Name</label>
        <input type="text" id="hostNameInput" placeholder="Enter Host Name" maxlength="12" value="Host Pig" />
      </div>

      <div class="form-group">
        <label>Secret Category</label>
        <select id="categorySelect">
          <option value="random" selected>🎲 Random Category</option>
          <option value="foods">🍕 Delicious Foods</option>
          <option value="animals">🦁 Animals & Wildlife</option>
          <option value="movies">🎬 Famous Movies</option>
          <option value="naughty">😈 Naughty & Funny Words</option>
        </select>
      </div>

      <div class="form-row">
        <div class="form-group half">
          <label>Players (3–15)</label>
          <input type="number" id="playersInput" min="3" max="15" value="5" />
        </div>

        <div class="form-group half">
          <label>Imposters</label>
          <select id="impostersSelect">
            <!-- Dynamically populated by script.js -->
          </select>
        </div>
      </div>

      <button class="btn btn-play" id="createLobbyBtn">CREATE ROOM 🚀</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
