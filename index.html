<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Naughty Imposter</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #1a162b; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; overflow-x: hidden; min-height: 100vh; }
    
    /* ANIMATION STAGE */
    #animation-stage { position: relative; height: 260px; display: flex; justify-content: center; align-items: flex-end; padding-bottom: 20px; overflow: hidden; }
    
    .pig-container { position: absolute; left: -150px; bottom: 20px; width: 140px; animation: walkIn 2.2s forwards ease-in-out; }
    .pig-body { width: 100px; height: 85px; background: #ff8da1; border-radius: 50px 60px 40px 40px; position: relative; border: 4px solid #333; margin: 0 auto; }
    .snout { width: 35px; height: 25px; background: #ff5e7e; border-radius: 12px; position: absolute; right: -10px; top: 35px; border: 3px solid #333; }
    .eyes { position: absolute; right: 20px; top: 22px; font-size: 14px; font-weight: bold; color: #333; }
    .underwear { position: absolute; bottom: 0; left: 10px; width: 80px; height: 40px; background: #4caf50; border-radius: 0 0 35px 35px; border: 3px solid #333; background-image: radial-gradient(#fff 20%, transparent 20%); background-size: 10px 10px; }
    
    /* FART CLOUD */
    .fart-cloud { position: absolute; left: -60px; bottom: 10px; width: 80px; height: 60px; background: rgba(186, 230, 80, 0.85); border-radius: 50%; opacity: 0; filter: blur(4px); border: 3px dashed #8bc34a; }
    .fart-text { position: absolute; left: -80px; bottom: 70px; font-size: 24px; font-weight: 900; color: #ccff00; opacity: 0; text-shadow: 2px 2px #000; }

    @keyframes walkIn {
      0% { left: -150px; }
      70% { left: 45%; transform: translateX(-50%); }
      100% { left: 45%; transform: translateX(-50%); }
    }

    @keyframes fartExplode {
      0% { opacity: 0; transform: scale(0.2); }
      50% { opacity: 1; transform: scale(1.8); }
      100% { opacity: 0; transform: scale(2.5); }
    }

    /* MENU CARD */
    .menu-card { background: #26213d; border: 3px solid #ff4081; border-radius: 16px; padding: 20px; width: 90%; max-width: 400px; margin: 0 auto 30px; box-shadow: 0 8px 20px rgba(0,0,0,0.6); opacity: 0; transform: translateY(30px); transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    .menu-card.show { opacity: 1; transform: translateY(0); }

    input, button, select { width: 100%; padding: 14px; margin: 8px 0; border-radius: 10px; border: none; font-size: 16px; font-weight: bold; }
    .btn-play { background: #ff9800; color: #fff; }
    .btn-host { background: #e91e63; color: #fff; }
    .btn-join { background: #2196f3; color: #fff; }
    .hidden { display: none; }
  </style>
</head>
<body>

  <!-- ANIMATED INTRO -->
  <div id="animation-stage">
    <div class="pig-container" id="pig">
      <div class="fart-cloud" id="fart"></div>
      <div class="fart-text" id="fart-txt">TOOT! 💨</div>
      <div class="pig-body">
        <div class="eyes">👀</div>
        <div class="snout"></div>
        <div class="underwear"></div>
      </div>
    </div>
  </div>

  <h1 style="color: #ff4081; margin: 0 0 10px;">😈 The Naughty Imposter</h1>

  <!-- POPUP MENU -->
  <div id="menu-popup" class="menu-card">
    <input type="text" id="player-name" placeholder="Enter Your Player Name">

    <!-- PLAY NOW (RANDOM PUBLIC MATCHMAKING) -->
    <button class="btn-play" onclick="playNow()">⚡ PLAY NOW (Random Match)</button>

    <hr style="border-color: #443c68; margin: 15px 0;">

    <select id="category">
      <option value="fruit">Category: Fruits</option>
      <option value="animals">Category: Animals</option>
    </select>
    <button class="btn-host" onclick="createRoom()">👑 Create Private Room</button>

    <input type="text" id="join-code" placeholder="Enter 4-Digit Room Code">
    <button class="btn-join" onclick="joinRoom()">🔑 Join Private Room</button>
  </div>

  <!-- GAME SCREEN -->
  <div id="game-screen" class="menu-card hidden">
    <h3>Room: <span id="display-code" style="color: #ff9800;"></span></h3>
    <p>Players Connected: <span id="player-count">1</span></p>
    <div id="role-display" style="font-size:20px; font-weight:bold; color:#ffeb3b; background:#372f54; padding:15px; border-radius:8px;">Waiting in lobby...</div>
    <button id="start-btn" onclick="startGame()" class="btn-host hidden">Start Game</button>
  </div>

  <script>
    // TRIGGER PIG FART & MENU POPUP ON LOAD
    window.onload = () => {
      setTimeout(() => {
        document.getElementById('fart').style.animation = 'fartExplode 1s forwards';
        document.getElementById('fart-txt').style.animation = 'fartExplode 1s forwards';
        
        setTimeout(() => {
          document.getElementById('menu-popup').classList.add('show');
        }, 500);
      }, 1800);
    };

    let peer, conn, connections = [];
    let roomCode = '';

    const words = {
      fruit: { word: "Banana", hint: "Yellow and long" },
      animals: { word: "Elephant", hint: "Large with a trunk" }
    };

    function playNow() {
      const name = document.getElementById('player-name').value;
      if (!name) return alert('Please enter your name');
      
      // Automatic Matchmaking: Join public room or create one
      document.getElementById('join-code').value = "PUBLIC100";
      joinRoom();
    }

    function createRoom() {
      const name = document.getElementById('player-name').value;
      if (!name) return alert('Please enter your name');

      roomCode = Math.floor(1000 + Math.random() * 9000).toString();
      peer = new Peer('ni-' + roomCode);

      peer.on('open', () => {
        showGameScreen(roomCode);
        document.getElementById('start-btn').classList.remove('hidden');
      });

      peer.on('connection', (c) => {
        connections.push(c);
        document.getElementById('player-count').innerText = connections.length + 1;
      });
    }

    function joinRoom() {
      const name = document.getElementById('player-name').value;
      let code = document.getElementById('join-code').value;
      if (!name || !code) return alert('Enter your name and room code');

      peer = new Peer();
      peer.on('open', () => {
        conn = peer.connect('ni-' + code);
        conn.on('open', () => showGameScreen(code));
        conn.on('data', (data) => {
          if (data.type === 'ROLE') {
            document.getElementById('role-display').innerText = data.text;
          }
        });
        conn.on('error', () => {
          // If public room doesn't exist yet, host it
          if(code === "PUBLIC100") {
            roomCode = "PUBLIC100";
            peer = new Peer('ni-PUBLIC100');
            showGameScreen("PUBLIC100");
          }
        });
      });
    }

    function showGameScreen(code) {
      document.getElementById('menu-popup').classList.add('hidden');
      document.getElementById('game-screen').classList.remove('hidden');
      document.getElementById('game-screen').classList.add('show');
      document.getElementById('display-code').innerText = code;
    }

    function startGame() {
      const cat = document.getElementById('category').value;
      const gameData = words[cat];

      connections.forEach((c, index) => {
        if (index === 0) {
          c.send({ type: 'ROLE', text: 'IMPOSTER! Hint: ' + gameData.hint });
        } else {
          c.send({ type: 'ROLE', text: 'CIVILIAN! Word: ' + gameData.word });
        }
      });

      document.getElementById('role-display').innerText = 'CIVILIAN! Word: ' + gameData.word;
    }
  </script>
</body>
</html>
